inferenceExtension:
  replicas: 1
  flags:
    v: 5 #4  # log verbosity
    # NOTE: kv-cache-usage-percentage-metric removed — deprecated in v0.5.1+
    # Configure metrics via engineConfigs/EndpointPickerConfig instead.
    # ha-enable-leader-election is a no-op at replicas=1 but kept for forward compat
    ha-enable-leader-election=false: ""

  image:
    name: llm-d-router-endpoint-picker
    hub: icr.io/kvc-storage
    tag: debug-pph-kvfilepath
    pullPolicy: Always

  extProcPort: 9002

  sidecar:
    enabled: true
    image: ghcr.io/llm-d/llm-d-uds-tokenizer:v0.8.0
    imagePullPolicy: IfNotPresent
    name: tokenizer-uds
    configMap:
      name: tokenizer-uds-config
      data:
        placeholder: ""
    env:
      - name: TOKENIZERS_DIR
        value: /tokenizers
      - name: HF_HOME
        value: /tokenizers
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: llm-d-hf-token
            key: HF_TOKEN
    volumeMounts:
      - mountPath: /tokenizers
        name: tokenizers
      - mountPath: /tmp/tokenizer
        name: tokenizer-uds

  # ZMQ port for kvevents.Pool (KVEvents subscriber)
  extraContainerPorts:
    - name: zmq
      containerPort: 5557
      protocol: TCP

  extraServicePorts:
    - name: zmq
      port: 5557
      targetPort: 5557
      protocol: TCP
    # v0.5.1: HTTP port required for health/metrics endpoints
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: llm-d-hf-token
          key: HF_TOKEN

  pluginsConfigFile: "precise-prefix-cache-config.yaml"
  pluginsCustomConfig:
    precise-prefix-cache-config.yaml: |
      apiVersion: llm-d.ai/v1alpha1 #inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
        # --- v0.5.1: new required data-plane plugins ---
        - type: token-producer #tokenizer
          parameters:
            modelName: Qwen/Qwen3-8B
            udsTokenizerConfig:
              socketFile: /tmp/tokenizer/tokenizer-uds.socket

        - type: endpoint-notification-source

        - type: metrics-data-source

        - type: core-metrics-extractor

        # --- handler / filters ---
        - type: single-profile-handler
        - type: decode-filter

        # --- scorers ---
        - type: precise-prefix-cache-scorer
          parameters:
            tokenProcessorConfig:
              blockSize: 64
              speculativeIndexing: true   # v0.5.1 addition
              hashAlgorithm: sha256_cbor # fnv64a_cbor
              hashSeed: "10"  
              blockSizeTokens: 64 # 16
            indexerConfig:
              tokenizersPoolConfig:
                modelName: Qwen/Qwen3-8B
                workersCount: 24          # v0.5.1 addition
                uds:
                  enabled: true
                  socketFile: /tmp/tokenizer/tokenizer-uds.socket
              kvBlockIndexConfig:
                enableMetrics: true       # v0.5.1 addition
            kvEventsConfig:
              topicFilter: "kv@"
              concurrency: 4
              discoverPods: false         # kept: using static zmqEndpoint below
              zmqEndpoint: "tcp://*:5557"

        - type: kv-cache-utilization-scorer
        - type: queue-scorer
        - type: no-hit-lru-scorer         # v0.5.1 addition

        # --- picker ---
        - type: max-score-picker

        # --- prefetch (your custom plugin, preserved) ---
        - type: prefetch-prerequest-handler
          parameters:
            engineKeysProviderPluginName: "precise-prefix-cache-scorer"
            kvFilePathBase:
              rootDir: /mnt/kv-cache-storage
              modelName: Qwen/Qwen3-8B
              gpuBlocksPerFile: 8
              tpSize: 1
              ppSize: 1
              pcpSize: 1
              dcpSize: 1
            prefetchConfig:
              enabled: true
              blockSize: 4194304
              blockCount: 3
              maxConcurrentFiles: 16
              workQueueSize: 256
              queueTimeout: 0

      # v0.5.1: dataLayer wires data sources → extractors
      dataLayer:
        sources:
          - pluginRef: metrics-data-source
            extractors:
              - pluginRef: core-metrics-extractor
          - pluginRef: endpoint-notification-source
            extractors:
              - pluginRef: precise-prefix-cache-scorer

      schedulingProfiles:
        - name: default
          plugins:
            - pluginRef: decode-filter            # v0.5.1 addition
            - pluginRef: precise-prefix-cache-scorer
              weight: 3.0
            - pluginRef: kv-cache-utilization-scorer
              weight: 2.0
            - pluginRef: queue-scorer
              weight: 2.0
            - pluginRef: no-hit-lru-scorer        # v0.5.1 addition
              weight: 2.0
            - pluginRef: max-score-picker

  monitoring:
    secret:
      name: kv-events-gateway-sa-metrics-reader-secret
    interval: "10s"
    prometheus:
      enabled: true
      auth:
        enabled: true

  serviceAccount:
    imagePullSecrets:
      - name: lpsecret
  
  volumes:
    - name: tokenizers       # tokenizer cache/HF home
      emptyDir: {}
    - name: tokenizer-uds    # shared UDS socket dir
      emptyDir: {}

  volumeMounts:
    - name: tokenizer-uds    # EPP needs to reach the socket
      mountPath: /tmp/tokenizer
  
  extraVolumeMounts:
    - name: scale-data-pvc
      mountPath: /mnt/kv-cache-storage

  extraVolumes:
    - name: scale-data-pvc
      persistentVolumeClaim:
        claimName: afm-pvc-n3


inferencePool:
  targetPorts:
    - number: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inferenceServing: "true"

