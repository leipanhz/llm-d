inferenceExtension:
  replicas: 1
  flags:
    # in vLLM 10.0+, the metric is renamed while upstream GAIE is still using the old name as default.
    # See https://github.com/kubernetes-sigs/gateway-api-inference-extension/pull/1905.
    kv-cache-usage-percentage-metric: "vllm:kv_cache_usage_perc"
    v: 4  # log verbosity
  image:
    # both downstream infernece-scheduler and upstream epp images can support precise KV Cache awareness based on the configurations here
    ###################
    name: llm-d-inference-scheduler
    #hub: ghcr.io/llm-d
    #tag: v0.5.0-rc.1
    hub: icr.io/kvc-storage
    tag: debug-v0.5.0.afm.n1-mapping  # n:1 mapping
    ###################
    # name: epp
    # hub: registry.k8s.io/gateway-api-inference-extension
    # tag: v1.2.0
    ###################
    pullPolicy: Always
  extProcPort: 9002
  # ZMQ port for `kvevents.Pool` (KVEvents subscriber)
  extraContainerPorts:
    - name: zmq
      containerPort: 5557
      protocol: TCP
  extraServicePorts:
    - name: zmq
      port: 5557
      targetPort: 5557
      protocol: TCP
  # huggingface token for tokenizer
  env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: llm-d-hf-token
          key: HF_TOKEN

  pluginsConfigFile: "precise-prefix-cache-config.yaml"
  pluginsCustomConfig:
    precise-prefix-cache-config.yaml: |
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
        - type: single-profile-handler
        - type: precise-prefix-cache-scorer
          parameters:
            tokenProcessorConfig:
              blockSize: 64
            indexerConfig:
              tokenizersPoolConfig:
                minPrefixOverlapRatio: 1.0    # Force full tokenization
                modelName: "Qwen/Qwen3-0.6B"
                hf:
                  tokenizersCacheDir: "/tmp/tokenizers"
            kvEventsConfig:
              topicFilter: "kv@"
              concurrency: 4
              discoverPods: false
              zmqEndpoint: "tcp://*:5557"
        - type: kv-cache-utilization-scorer
        - type: queue-scorer
        - type: max-score-picker
        - type: prefetch-prerequest-handler
          parameters:
            engineKeysProviderPluginName: "precise-prefix-cache-scorer"
            kvFilePathBase:
              rootDir: /mnt/kv-cache-storage
              modelParentDir: Qwen
              modelName: Qwen3-0.6B
              gpuBlockSize: 64
              gpuBlocksPerFile: 8
              tpSize: 1
              ppSize: 1
              pcpSize: 1
              dtype: auto
            prefetchConfig:
              enabled: true
              blockSize: 4194304           # 4 MiB
              blockCount: 3                # 3 blocks = 12 MiB per file
              maxConcurrentFiles: 16       # 16 workers = 192 MiB total memory
              workQueueSize: 256           # Work queue buffer size (default: 256)
              queueTimeout: 0              # Optional: timeout in ms for queue send (0 = blocking, >0 = timeout)
      schedulingProfiles:
        - name: default
          plugins:
            - pluginRef: precise-prefix-cache-scorer
              weight: 3.0
            - pluginRef: kv-cache-utilization-scorer
              weight: 2.0
            - pluginRef: queue-scorer
              weight: 2.0
            - pluginRef: max-score-picker

  # Monitoring configuration for EPP
  monitoring:
    secret:
      name: kv-events-gateway-sa-metrics-reader-secret
    interval: "10s"
    # Prometheus ServiceMonitor will be created when enabled for EPP metrics collection
    prometheus:
      enabled: true
      auth:
        # To allow unauthenticated /metrics access (e.g., for debugging with curl), set to false
        enabled: true
inferencePool:
  targetPorts:
    - number: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inferenceServing: "true"
      #llm-d.ai/inference-serving: "true"
      #llm-d.ai/guide: "precise-prefix-cache-aware"
